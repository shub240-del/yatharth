services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: yatharth
      POSTGRES_USER: yatharth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-before-deployment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yatharth -d yatharth"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://yatharth:${POSTGRES_PASSWORD:-local-only-change-before-deployment}@postgres:5432/yatharth
      JWT_SECRET: ${JWT_SECRET:-}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      OPENWORKER_ENABLED: ${OPENWORKER_ENABLED:-false}
      LLM_URL: ${LLM_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
